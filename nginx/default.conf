# nginx reverse proxy and load balancer in front of the R app replicas.
#
# Plain HTTP only. On a real VM, TLS would be added in this file: a second
# server block with "listen 443 ssl;", ssl_certificate and ssl_certificate_key
# (for example from Let's Encrypt), and a redirect from port 80 to 443.
# The certificate files would be mounted into the nginx container read-only,
# and port 443 would be published in docker-compose.yml.
#
# No sticky sessions are needed. No per-user state lives in R's memory: the
# session (the CSRF token) is in a signed cookie, and the data is in SQLite.
# So any replica can answer any request, and nginx is free to pick whichever
# is least busy. Shiny is different: each user's session lives inside one R
# process, so every request from that user must reach the same process, which
# needs sticky sessions (see the commented block at the end of this file).

# Docker's internal DNS server. nginx asks it which addresses are behind the
# name "app" (one per replica), and asks again when the answer is 10 seconds
# old, so replicas that start, stop, or are recreated are picked up without
# restarting nginx. ipv6=off: the Compose network here is IPv4 only.
resolver 127.0.0.11 valid=10s ipv6=off;

upstream app_replicas {
    # Shared memory for the list of replicas and their state, so all nginx
    # worker processes see the same list. Required by "resolve" below.
    zone app_replicas 64k;

    # Send each request to the replica with the fewest active requests. Each
    # replica is one R process handling one request at a time, so a slow
    # request on one replica does not hold up requests that can go elsewhere.
    least_conn;

    # "app" is the Compose service name. "resolve" makes nginx look the name
    # up through the resolver above and use every address it returns, one
    # server per replica. Available in open source nginx 1.27.3 and newer.
    server app:8000 resolve;

    # Keep up to 16 idle connections to the replicas open for reuse, instead
    # of opening a new TCP connection for every request. Needs the HTTP/1.1
    # and Connection settings in the location block below.
    keepalive 16;

    # Sticky sessions for a Shiny-style app would replace "least_conn" with:
    # ip_hash;
}

# WebSocket apps (such as Shiny) need this map, used by the commented
# "Connection" header in the location block below.
# map $http_upgrade $connection_upgrade {
#     default upgrade;
#     ''      close;
# }

server {
    listen 80;
    server_name _;

    client_max_body_size 1m;

    location / {
        proxy_pass http://app_replicas;

        # HTTP/1.1 and an empty Connection header let nginx reuse the
        # keepalive connections to the replicas.
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;

        # WebSocket apps (such as Shiny) need these lines instead of the
        # Connection line above, plus ip_hash in the upstream block. Long
        # timeouts keep idle sessions open, and buffering off streams updates
        # immediately.
        # proxy_set_header Upgrade    $http_upgrade;
        # proxy_set_header Connection $connection_upgrade;
        # proxy_read_timeout 1d;
        # proxy_send_timeout 1d;
        # proxy_buffering off;
    }
}
